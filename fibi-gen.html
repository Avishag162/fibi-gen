<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fa;--card:#fff;--tx:#0d1b3d;--mu:#667794;--pr:#1556e6;--ac:#f5a524;--up:#0a9c5b;--dn:#d6334a;--bd:#dde5f1;--hero:#0d1b3d;--herotx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080f20;--card:#111b33;--tx:#eaf0fb;--mu:#8d9bb5;--pr:#5b93ff;--bd:#21304f;--up:#2ed08a;--dn:#ff6b7f;--hero:#16264d;--herotx:#fff}}
:root[data-theme="dark"]{--bg:#080f20;--card:#111b33;--tx:#eaf0fb;--mu:#8d9bb5;--pr:#5b93ff;--bd:#21304f;--up:#2ed08a;--dn:#ff6b7f;--hero:#16264d;--herotx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Heebo',system-ui,Arial,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding:0 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.3px}.logo i{font-style:normal;color:var(--ac)}
.tag{font-size:11px;color:var(--mu);border:1px solid var(--bd);border-radius:99px;padding:3px 9px}
.kids{display:flex;gap:8px;margin:4px 0 14px}
.kid{flex:1;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:9px 12px;text-align:start}
.kid b{display:block;font-size:15px}.kid span{font-size:12px;color:var(--mu)}
.kid[aria-pressed=true]{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 18%,transparent)}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:20px 18px 16px}
.hero small{opacity:.7;font-size:13px}
.big{font-size:38px;font-weight:800;letter-spacing:-1px;margin:2px 0}
.chg{font-size:14px;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}
.hero .up{color:#5ff0b0}.hero .dn{color:#ff8e9e}
svg.spark{width:100%;height:64px;margin-top:10px;display:block}
.cash{display:flex;justify-content:space-between;font-size:13px;opacity:.85;margin-top:8px;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:14px}
h2{font-size:16px;margin:0 0 4px}.sub{font-size:13px;color:var(--mu);margin:0 0 12px}
.line{position:relative;height:10px;background:var(--bd);border-radius:9px;margin:26px 4px 8px}
.line .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:9px;background:linear-gradient(90deg,var(--pr),var(--ac))}
.line .dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:var(--ac);border:3px solid var(--card);transform:translate(50%,-50%)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cmp div{border-radius:14px;padding:12px;background:var(--bg)}
.cmp small{color:var(--mu);font-size:12px;display:block}.cmp b{font-size:20px}
.cmp .m{background:color-mix(in srgb,var(--pr) 12%,var(--card));border:1px solid color-mix(in srgb,var(--pr) 35%,transparent)}
label.r{display:flex;justify-content:space-between;font-size:14px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--pr)}
.note{font-size:11.5px;color:var(--mu);margin-top:10px;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.row:last-child{border-bottom:0}
.row .n b{display:block;font-size:15px}.row .n span{font-size:12px;color:var(--mu)}
.row .p{text-align:end;font-weight:600;font-size:15px}.row .p span{display:block;font-size:12px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--pr);color:#fff}
.btn.o{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}
.btn.s{padding:7px 12px;font-size:13px}
nav{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;z-index:5}
nav button{flex:1;max-width:140px;border:0;background:none;padding:8px;border-radius:12px;font-size:13px;color:var(--mu);font-weight:600}
nav button[aria-current=true]{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.amt{width:100%;font:800 30px 'Heebo',sans-serif;text-align:center;border:1.5px solid var(--bd);border-radius:14px;padding:12px;background:var(--bg);color:var(--tx)}
.chips{display:flex;gap:8px;margin:10px 0}.chips button{flex:1;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:7px;font-size:13px}
.sum{font-size:13px;color:var(--mu);text-align:center;margin:8px 0 14px;min-height:20px}
.toast{position:fixed;inset-inline:0;top:calc(14px + env(safe-area-inset-top,0px));margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:22px 8px;font-size:14px}
.kids{overflow-x:auto}.kid{min-width:112px}.kid.add{flex:0 0 auto;min-width:96px;border-style:dashed;color:var(--pr)}
.mch{display:flex;gap:8px;overflow-x:auto;margin:4px 0 12px}.mch button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 14px;font-size:13px}.mch button[aria-pressed=true],.gchips button[aria-pressed=true]{background:var(--pr);color:#fff;border-color:var(--pr)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.kv:last-child{border:0}
.bar{height:8px;border-radius:6px;background:var(--bd);margin:5px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.acc{display:none;position:fixed;inset:0;background:var(--bg);z-index:15;overflow:auto}.acc.on{display:block}
.accin{max-width:440px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 40px}
.fl{display:block;font-size:14px;font-weight:600;margin-top:14px}.fl input{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
.opt{display:block;width:100%;text-align:start;border:1.5px solid var(--bd);background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px}.opt b{display:block}.opt span{font-size:12.5px;color:var(--mu)}.opt[aria-pressed=true]{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 18%,transparent)}
.err{color:var(--dn);font-size:13px;margin-top:12px}
.steps{display:flex;gap:6px;margin:10px 0 18px}.steps i{flex:1;height:5px;border-radius:4px;background:var(--bd)}.steps i.d{background:var(--pr)}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.gchips button{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:8px 14px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:14px;line-height:1.5}.ck input{margin-top:3px;width:18px;height:18px;accent-color:var(--pr)}
.nv{display:flex;gap:10px;margin-top:20px}.nv .btn{flex:1}
.hero.kidh{background:linear-gradient(135deg,#1556e6,#0d1b3d)}.hero.play{background:color-mix(in srgb,var(--ac) 32%,var(--hero))}
.lock{display:inline-block;font-size:12px;background:color-mix(in srgb,var(--ac) 22%,transparent);border-radius:99px;padding:3px 10px;margin-top:8px}
.top .btn.s{white-space:nowrap}
#gate{z-index:40}
.cr{text-align:center;font-size:12px;color:var(--mu);padding:18px 0 4px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav id="nav"></nav>
<div class="sheet-bg" id="bg"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div class="acc" id="acc"></div>
<div class="acc" id="roi"></div>
<div class="acc" id="qrov"></div>
<div class="acc on" id="gate"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const CR='<div class="cr">© 2026 Avishag Mevorach · כל הזכויות שמורות</div>';
const ASSETS=[
{s:'SPX',n:'מדד S&P 500',t:'קרן סל',p:1850,v:.004},
{s:'NDX',n:'נאסד״ק 100',t:'קרן סל',p:1590,v:.006},
{s:'TA125',n:'ת״א 125',t:'קרן סל',p:2010,v:.005},
{s:'BOND',n:'אג״ח ממשלתי',t:'קרן סל',p:410,v:.0012},
{s:'AAPL',n:'Apple',t:'מניה',p:690,v:.008},
{s:'NVDA',n:'Nvidia',t:'מניה',p:3300,v:.012},
{s:'TEVA',n:'טבע',t:'מניה',p:68,v:.01}];
const px={};ASSETS.forEach(a=>px[a.s]={p:a.p,o:a.p});
const KIDS=[
{name:'נועה',age:9,cash:1200,h:{SPX:{q:1.2,c:2000},TA125:{q:.6,c:1150}},hist:[]},
{name:'יובל',age:5,cash:800,h:{BOND:{q:2,c:800}},hist:[]}];
let cur=0,tab='home',dep=500,trade=null;
const $=id=>document.getElementById(id);
const f=(n,d=0)=>'₪'+Number(n).toLocaleString('he-IL',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=n=>(n>=0?'+':'')+n.toFixed(2)+'%';
const asset=s=>ASSETS.find(a=>a.s===s);
function inv(k){return Object.entries(k.h).reduce((t,[s,x])=>t+x.q*px[s].p,0)}
function cost(k){return Object.values(k.h).reduce((t,x)=>t+x.c,0)}
function total(k){return k.cash+inv(k)}
function snap(){KIDS.forEach(k=>{k.hist.push(total(k));if(k.hist.length>40)k.hist.shift()})}
for(let i=0;i<30;i++){ASSETS.forEach(a=>{px[a.s].p*=1+(Math.random()-.47)*a.v});snap()}
function tick(){ASSETS.forEach(a=>{px[a.s].p*=1+(Math.random()-.48)*a.v});snap();if(!trade&&!pinOpen)render()}
setInterval(tick,3500);
function spark(h){
 const mn=Math.min(...h),mx=Math.max(...h),r=(mx-mn)||1;
 const pts=h.map((v,i)=>[(i/(h.length-1))*300,56-((v-mn)/r)*48]);
 const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
 return `<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="#5ff0b0" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
function fv(m,y,r){const i=r/12,n=y*12;return m*((Math.pow(1+i,n)-1)/i)}
function home(k){
 const t=total(k),c=cost(k),g=inv(k)-c,gp=c?g/c*100:0,yrs=18-k.age;
 const sav=fv(dep,yrs,.03),mkt=fv(dep,yrs,.07),put=dep*12*yrs;
 return `<div class="hero"><small>שווי התיק של ${k.name}</small><div class="big">${f(t)}</div>
 <div class="chg ${g>=0?'up':'dn'}">${g>=0?'▲':'▼'} ${f(Math.abs(g))} (${pct(gp)}) מתחילת ההשקעה</div>${spark(k.hist)}
 <div class="cash"><span>מזומן זמין לקנייה</span><b>${f(k.cash)}</b></div></div>
 <div class="card"><h2>הדרך לגיל 18</h2><p class="sub">ההשקעה רשומה על שם ${k.name} ונשארת בניהולכם עד הבגרות.</p>
 <div class="line"><div class="fill" style="width:${k.age/18*100}%"></div><div class="dot" style="inset-inline-start:${k.age/18*100}%"></div></div>
 <div class="ends"><span>גיל 0</span><span>היום: ${k.age}</span><span>גיל 18</span></div></div>
 <div class="card"><h2>שוק ההון מול תוכנית חיסכון</h2><p class="sub">סימולציה ל־${yrs} שנים עד גיל 18</p>
 <label class="r"><span>הפקדה חודשית</span><b>${f(dep)}</b></label>
 <input type="range" id="dep" min="100" max="3000" step="50" value="${dep}" aria-label="הפקדה חודשית">
 <div class="cmp"><div><small>תוכנית חיסכון (3% בשנה)</small><b>${f(sav)}</b></div><div class="m"><small>תיק מנוהל (7% בשנה)</small><b>${f(mkt)}</b></div></div>
 <p class="note">סה״כ הפקדות: ${f(put)}. הנתונים להמחשה בלבד, הנחות התשואה אינן הבטחה, ובשוק ההון עלול להיות הפסד. זו אפליקציית דמה ואינה ייעוץ השקעות.</p></div>`}
function market(k){
 return `<div class="card" style="margin-top:4px"><h2>שוק</h2><p class="sub">בחרו נכס כדי לקנות עבור ${k.name}. המחירים משתנים בזמן אמת (דמה).</p>`+
 ASSETS.map(a=>{const x=px[a.s],c=(x.p/x.o-1)*100;return `<button class="row" data-s="${a.s}"><span class="n"><b>${a.n}</b><span>${a.t} · ${a.s}</span></span><span class="p">${f(x.p,2)}<span class="${c>=0?'up':'dn'}">${pct(c)}</span></span></button>`}).join('')+`</div>`}
function port(k){
 const e=Object.entries(k.h).filter(([,x])=>x.q>1e-6);
 return `<div class="card" style="margin-top:4px"><h2>התיק של ${k.name}</h2><p class="sub">מזומן: ${f(k.cash)}</p>`+
 (e.length?e.map(([s,x])=>{const a=asset(s),v=x.q*px[s].p,g=v-x.c;return `<button class="row" data-s="${s}" data-m="sell"><span class="n"><b>${a.n}</b><span>${x.q.toFixed(3)} יח׳ · עלות ${f(x.c)}</span></span><span class="p">${f(v)}<span class="${g>=0?'up':'dn'}">${g>=0?'+':'−'}${f(Math.abs(g))}</span></span></button>`}).join(''):'<div class="empty">התיק עדיין ריק. עברו ללשונית שוק וקנו את הנכס הראשון.</div>')+
 `<button class="btn o" id="topup" style="width:100%;margin-top:12px">הפקידו ${f(500)} מחשבון העו״ש</button></div>`}
function render(){if(mode=='child')return renderChild();renderParent()}
function renderParent(){
 const k=KIDS[cur],sc=window.scrollY;
 $('app').innerHTML=`<div class="top"><div class="logo">fibi <i>gen</i></div><span style="display:flex;gap:6px;align-items:center"><button class="btn o s" data-qr="1">QR</button><button class="btn o s" data-roi="1">ROI בנק</button><button class="btn o s" data-mode="child">תצוגת ילד</button></span></div>
 <div class="kids">${KIDS.map((x,i)=>`<button class="kid" data-k="${i}" aria-pressed="${i==cur}"><b>${x.name}</b><span>גיל ${x.age} · ${f(total(x))}</span></button>`).join('')}<button class="kid add" data-add="1"><b>＋</b><span>פתיחת חשבון</span></button></div>`+
 (tab=='home'?home(k):tab=='market'?market(k):tab=='report'?report(k):port(k))+CR;
 $('nav').innerHTML=[['home','סקירה'],['market','שוק'],['port','תיק'],['report','דוח']].map(([id,l])=>`<button data-t="${id}" ${tab==id?'aria-current="true"':''}>${l}</button>`).join('');
 window.scrollTo(0,sc)}
$('app').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.qr)openQr();else if(b.dataset.roi)openRoi();else if(b.dataset.mode){mode='child';tab='cmy';render();window.scrollTo(0,0)}
 else if(b.dataset.add)openAcc();
 else if(b.dataset.r!=null){rm=+b.dataset.r;render()}
 else if(b.dataset.mail)toast('הדוח נשלח למייל ההורה (דמה)');
 else if(b.dataset.k!=null){cur=+b.dataset.k;render()}
 else if(b.dataset.s)open(b.dataset.s,b.dataset.m||'buy');
 else if(b.id=='topup'){KIDS[cur].cash+=500;log(KIDS[cur],'dep','הפקדה מחשבון עו״ש',500);toast('הופקדו '+f(500)+' לחשבון של '+KIDS[cur].name);render()}});
$('app').addEventListener('input',e=>{if(e.target.id=='dep'){dep=+e.target.value;const sc=window.scrollY;render();const r=$('dep');r.focus();window.scrollTo(0,sc)}});
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;render();window.scrollTo(0,0)}});
function open(s,m,play){trade={s,m,v:'',play:!!play};drawSheet();$('bg').classList.add('on');setTimeout(()=>$('amt')&&$('amt').focus(),50)}
function close(){trade=null;$('bg').classList.remove('on')}
$('bg').addEventListener('click',e=>{if(e.target.id=='bg')close()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&trade)close()});
function drawSheet(){
 const k=trade.play?playAcc(KIDS[cur]):KIDS[cur],{s,m,v}=trade,a=asset(s),h=k.h[s],max=m=='buy'?k.cash:(h?h.q*px[s].p:0),n=parseFloat(v)||0;
 const ok=n>0&&n<=max+1e-6;
 $('sheet').innerHTML=`<h2>${a.n} <span style="color:var(--mu);font-weight:400;font-size:13px">${f(px[s].p,2)}</span></h2>
 <div class="seg"><button data-m="buy" aria-pressed="${m=='buy'}">קנייה</button><button data-m="sell" aria-pressed="${m=='sell'}">מכירה</button></div>
 <input class="amt" id="amt" inputmode="decimal" placeholder="סכום ב־₪" value="${v}" aria-label="סכום בשקלים">
 <div class="chips"><button data-a="100">100</button><button data-a="500">500</button><button data-a="max">הכול</button></div>
 <div class="sum">${m=='buy'?'זמין לקנייה':'זמין למכירה'}: ${f(max)}${n>0?' · '+(n/px[s].p).toFixed(4)+' יח׳':''}${n>max+1e-6?'<br><span class="dn">הסכום גבוה מהיתרה הזמינה</span>':''}</div>
 <button class="btn" id="go" style="width:100%" ${ok?'':'disabled style="width:100%;opacity:.45"'}>${m=='buy'?'קנו':'מכרו'} עבור ${k.name}</button>`}
$('sheet').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const k=trade.play?playAcc(KIDS[cur]):KIDS[cur],s=trade.s;
 if(b.dataset.m){trade.m=b.dataset.m;trade.v='';drawSheet()}
 else if(b.dataset.a){const h=k.h[s],max=trade.m=='buy'?k.cash:(h?h.q*px[s].p:0);trade.v=b.dataset.a=='max'?String(Math.floor(max*100)/100):b.dataset.a;drawSheet()}
 else if(b.id=='go'){
  const n=parseFloat(trade.v),q=n/px[s].p;
  if(trade.m=='buy'){k.cash-=n;const h=k.h[s]||(k.h[s]={q:0,c:0});h.q+=q;h.c+=n;toast('נקנו '+q.toFixed(3)+' יח׳ של '+asset(s).n)}

 <div class="kv"><span>הכנסות מדמי ניהול ועמלות</span><b class="up">${fm(s.rev)}</b></div><div class="kv"><span>הכנסות שאבדו מתוכניות חיסכון</span><b class="dn">${fm(-s.lost)}</b></div><div class="kv"><span>עלויות הקמה ותפעול</span><b class="dn">${fm(-s.cost)}</b></div><div class="kv"><span>רווח נטו</span><b class="${s.cum>=0?'up':'dn'}">${fm(s.cum)}</b></div></div>`}
function drawRoi(){
 $('roi').innerHTML=`<div class="accin"><div class="top" style="padding-top:0"><div class="logo">fibi <i>gen</i></div><button data-x="1" aria-label="סגירה" style="border:0;background:none;font-size:22px">✕</button></div>
 <h2>סימולציית ROI לבנק</h2><p class="sub">כמה ההורים יגדילו את ההשקעה החודשית שלהם בשוק ההון בגלל מסחר עבור הילדים, ומה זה שווה לבנק.</p>
 <div class="mch">${Object.keys(SC).map(k=>`<button data-sc="${k}" aria-pressed="${RS==k}">תרחיש ${SCN[k]}</button>`).join('')}</div>
 <div class="mch">${[12,24,36].map(h=>`<button data-h="${h}" aria-pressed="${RH==h}">${h/12==1?'שנה':h/12+' שנים'}</button>`).join('')}</div>
 <div id="roires"></div>
 <div class="card"><h2>הנחות לשינוי</h2>${RP.map(([k,l,mn,mx,st])=>`<label class="r" style="margin-top:12px"><span>${l}</span><b id="rl-${k}">${rfmt(k,RV[k])}</b></label><input type="range" data-rk="${k}" min="${mn}" max="${mx}" step="${st}" value="${RV[k]}" aria-label="${l}">`).join('')}
 <p class="note">הנחות קבועות: ${TRADES} פעולות בחודש ללקוח, מרווח של 1.2% בשנה על תוכניות חיסכון, עלות שירות של ${f(SERVE)} ללקוח בשנה ועלות תפעול של ${f(FIX)} בשנה. המספרים להמחשה בלבד ואינם תחזית.</p></div>${CR}</div>`;renderRes()}
function openRoi(){drawRoi();$('roi').classList.add('on');$('roi').scrollTop=0}
$('roi').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.x)$('roi').classList.remove('on');
 else if(b.dataset.sc){RS=b.dataset.sc;RV={...SC[RS]};drawRoi()}
 else if(b.dataset.h){RH=+b.dataset.h;drawRoi()}});
$('roi').addEventListener('input',e=>{const k=e.target.dataset.rk;if(!k)return;RV[k]=+e.target.value;$('rl-'+k).textContent=rfmt(k,RV[k]);renderRes()});
let qrU='https://claude.ai/artifact/4qatyQgE2FyYWP4tHPBKNj';
function qrSvg(t){try{const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),m=2;let p='';
 for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))p+=`M${c+m} ${r+m}h1v1h-1z`;
 return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" style="width:100%;display:block" shape-rendering="crispEdges" role="img" aria-label="קוד QR"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}catch(e){return '<div class="empty" style="color:#333">לא היה אפשר ליצור קוד QR. בדקו את הקישור.</div>'}}
function openQr(){
 $('qrov').innerHTML=`<div class="accin"><div class="top" style="padding-top:0"><div class="logo">fibi <i>gen</i></div><button data-x="1" aria-label="סגירה" style="border:0;background:none;font-size:22px">✕</button></div>
 <h2>סרקו כדי לנסות את האפליקציה</h2><p class="sub">השירות הסריקה במצלמה של הטלפון והאפליקציה תפתח בדפדפן.</p>
 <div id="qrbox" style="background:#fff;padding:14px;border-radius:18px;max-width:340px;margin:12px auto">${qrSvg(qrU)}</div>
 <label class="fl">הקישור שבקוד<input id="qru" dir="ltr" value="${esc(qrU)}" autocomplete="off"></label>
 <p class="note">הדביקו כאן את קישור השיתוף הסופי של האפליקציה אם הוא שונה, והקוד יתעדכן. בדקו שהאפליקציה נפתחת גם מטלפון שאינו מחובר לחשבון שלכם.</p>${CR}</div>`;
 $('qrov').classList.add('on');$('qrov').scrollTop=0}
$('qrov').addEventListener('click',e=>{if(e.target.closest('button'))$('qrov').classList.remove('on')});
$('qrov').addEventListener('input',e=>{if(e.target.id=='qru'){qrU=e.target.value.trim();$('qrbox').innerHTML=qrSvg(qrU||' ')}});
let gs=null,gv='form',gerr='',gn='',ge='',gk=false;
try{gs=JSON.parse(localStorage.getItem('fg_nda')||'null')}catch(e){}
function drawGate(){
 let b;
 if(gv=='receipt'&&gs)b=`<h2>האישור נרשם</h2><div class="card" style="margin-top:10px"><div class="kv"><span>שם</span><b>${esc(gs.n)}</b></div><div class="kv"><span>אימייל</span><b dir="ltr">${esc(gs.e)}</b></div><div class="kv"><span>תאריך ושעה</span><b>${new Date(gs.t).toLocaleString('he-IL')}</b></div></div><p class="note">צילום מסך של המסך הזה משמש אסמכתא לאישור. הפרטים שמורים בדפדפן שלכם בלבד.</p><div class="nv"><button class="btn" data-ggo="1">המשיכו לאפליקציה</button></div>`;
 else b=`<h2>אישור סודיות ושימוש</h2><p class="sub">האפליקציה fibi gen, העיצוב, הטקסטים, מודל ה־ ROI והרעיון העסקי שמוצגים בה הם יצירתה של Avishag Mevorach © 2026, ומוצגים לצורך הערכה בלבד.</p>
 <label class="fl">שם מלא<input id="g-n" autocomplete="name" value="${esc(gn)}"></label>
 <label class="fl">אימייל<input id="g-e" type="email" dir="ltr" autocomplete="email" inputmode="email" value="${esc(ge)}"></label>
 <label class="ck"><input type="checkbox" id="g-ok" ${gk?'checked':''}><span>אני מתחייב/ת: (1) לא להעתיק, לשכפל או לפתח מוצר או שירות על בסיס החומר; (2) לא להעביר אותו לאחרים ללא אישור בכתב; (3) לא להשתמש בו למטרה מסחרית. אני מבין/ה שהאישור אינו מעניק לי רישיון.</span></label>
 <p class="note">השם והאימייל נשמרים בדפדפן שלך בלבד ולא נשלחים לאף אחד.</p>${gerr?`<div class="err" role="alert">${gerr}</div>`:''}
 <div class="nv"><button class="btn" data-gok="1">אישור והמשך</button></div>`;
 $('gate').innerHTML=`<div class="accin"><div class="top" style="padding-top:0"><div class="logo">fibi <i>gen</i></div></div>${b}${CR}</div>`;
 $('gate').classList.add('on')}
$('gate').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.ggo)$('gate').classList.remove('on');
 else if(b.dataset.gok){
  const n=$('g-n').value.trim(),m=$('g-e').value.trim(),ok=$('g-ok').checked;gn=n;ge=m;gk=ok;
  if(n.length<2)gerr='הזינו שם מלא';
  else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m))gerr='הזינו כתובת אימייל תקינה';
  else if(!ok)gerr='יש לסמן את ההתחייבות כדי להמשיך';
  else{gerr='';gs={n,e:m,t:new Date().toISOString()};try{localStorage.setItem('fg_nda',JSON.stringify(gs))}catch(x){}gv='receipt'}
  drawGate()}});
if(gs)$('gate').classList.remove('on');else drawGate();
render();
</script>
</body>
</html>
